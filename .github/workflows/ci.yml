name: ci

on:
  merge_group:
    types: [checks_requested]
  push:
    branches:
      - main
  pull_request:
    # `edited` re-checks the title, which a squash merge commits.
    types: [opened, synchronize, reopened, edited]
    branches:
      - main

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  commit-lint:
    name: commit-lint
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout 🛎
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup node env 🏗
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          cache: pnpm
          node-version-file: .nvmrc

      # package.json only carries commitlint; the service itself is Go.
      - name: Install dependencies 👨🏻‍💻
        run: pnpm install --frozen-lockfile

      - name: Validate pushed commit
        if: github.event_name == 'push'
        run: pnpm exec commitlint --from HEAD~1 --to HEAD --verbose

      - name: Validate pull request commits
        if: github.event_name == 'pull_request'
        run: pnpm exec commitlint --from "${BASE_SHA}" --to "${HEAD_SHA}" --verbose
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}

      # A squash merge commits the pull request title, so it has to pass too.
      - name: Validate pull request title
        if: github.event_name == 'pull_request'
        run: printf '%s\n' "${PR_TITLE}" | pnpm exec commitlint --verbose
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}

  check-typos:
    name: check-typos
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout 🛎
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run typos checker
        uses: crate-ci/typos@7f9d0819ca1c008ade73f4b41fa9d258d48f605b # v1.51.1

  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout 🛎
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Every audit, pedantic ones included, failing the job on any finding.
      - name: Audit workflows
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          persona: auditor
          advanced-security: false

  go:
    name: go
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout 🛎
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # renovate: datasource=github-releases depName=golangci/golangci-lint
          version: v2.15.0

      - name: Test
        run: go test -race -covermode=atomic -coverpkg=./... -coverprofile=coverage.out ./...

      - name: Coverage
        run: |
          {
            echo "## Coverage"
            echo
            scripts/coverage.sh coverage.out
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Vet the preview build
        run: go vet -tags preview ./internal/web

      - name: Build
        run: go build ./...

      - name: Check for known vulnerabilities
        run: go run "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK}" ./...
        env:
          # renovate: datasource=go depName=golang.org/x/vuln
          GOVULNCHECK: v1.9.0

  build-docker:
    name: build-docker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout 🛎
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Builds the image and checks that the build context holds only sources
      # (no keys, exports or test code) and the image only the two binaries,
      # the CA bundle and the data directories, running as a non-root user.
      - name: Build and check the image
        run: scripts/check-image.sh
